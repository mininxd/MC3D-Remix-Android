name: Build Pure Rust Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK (Pure Rust)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache cargo-apk
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-apk
          key: ${{ runner.os }}-cargo-apk

      - name: Install cargo-apk
        run: |
          if ! command -v cargo-apk &> /dev/null; then
            cargo install cargo-apk
          fi

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26d

      - name: Build Pure Rust Android APK
        env:
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: cargo apk build --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MC3D-Remix-Android-Rust-APK
          path: target/release/apk/*.apk
          if-no-files-found: error
