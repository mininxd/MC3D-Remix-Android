name: Build APK

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      NDK_VERSION: 28.2.13676358
      CMAKE_VERSION: 3.31.6

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Install Android SDK Packages
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "ndk;$NDK_VERSION" "cmake;$CMAKE_VERSION"

      - name: Build Release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Name the APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk MC3D-Remix.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MC3D-Remix
          path: MC3D-Remix.apk
          if-no-files-found: error

      - name: Release notes
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          apk="MC3D-Remix.apk"
          size=$(awk -v b="$(stat -c %s "$apk")" 'BEGIN { printf "%.1f MB", b / 1048576 }')
          sha=$(sha256sum "$apk" | cut -d' ' -f1)
          sed -e "s|{{VERSION}}|$GITHUB_REF_NAME|g" -e "s|{{TAG}}|$GITHUB_REF_NAME|g" -e "s|{{APK}}|$apk|g" \
              -e "s|{{SIZE}}|$size|g" -e "s|{{SHA256}}|$sha|g" ci/release-notes.md > release-notes-out.md

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: MC3D Remix ${{ github.ref_name }}
          body_path: release-notes-out.md
          files: MC3D-Remix.apk
          generate_release_notes: true
          make_latest: true
