<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Pause Button (Filled Dark)">
  <defs>
    <mask id="m-pause" maskUnits="userSpaceOnUse" x="0" y="0" width="512" height="512">
      <rect x="0" y="0" width="512" height="512" fill="#FFFFFF"/>
      <g transform="scale(4)">
        <rect x="44" y="42" width="13" height="44" rx="5" fill="#000000"/>
        <rect x="71" y="42" width="13" height="44" rx="5" fill="#000000"/>
      </g>
    </mask>
  </defs>
  <g id="btn-pause">
    <g mask="url(#m-pause)">
      <g transform="scale(4)">
        <circle cx="64" cy="64" r="52" fill="#18181B" stroke="#18181B" stroke-width="6"/>
      </g>
    </g>
  </g>
</svg>
