    <rect x="35" y="47" width="23" height="34" rx="11.5" fill="none" stroke="#000000" stroke-width="7.2"/>
    <line x1="71" y1="47" x2="71" y2="81" stroke="#000000" stroke-width="7.2" stroke-linecap="round"/>
    <line x1="91" y1="47" x2="72" y2="64" stroke="#000000" stroke-width="7.2" stroke-linecap="round"/>
    <line x1="77" y1="60" x2="92" y2="81" stroke="#000000" stroke-width="7.2" stroke-linecap="round"/>
